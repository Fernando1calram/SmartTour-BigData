
services:
  postgres:
    image: postgres:17
    container_name: postgres-prueba
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ClaseDB2026!
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./datos:/datos
    networks:
      - red-bbdd
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-prueba
    environment:
      PGADMIN_DEFAULT_EMAIL: "alumno@clase.com"
      PGADMIN_DEFAULT_PASSWORD: "AdminClase2026!"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./datos:/datos
    depends_on:
      - postgres
    networks:
      - red-bbdd
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.64.1
    container_name: metabase
    hostname: metabase
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Europe/Madrid

    volumes:
      - metabase_data:/metabase-data

    depends_on:
      - postgres

    networks:
      - red-bbdd

volumes:
  datos_postgres:
  pgadmin_data:
  metabase_data:

networks:
  red-bbdd:
    driver: bridge