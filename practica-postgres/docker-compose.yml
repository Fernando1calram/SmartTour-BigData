
services:
  postgres:
    image: postgres:17
    container_name: postgres-prueba
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ClaseDB2026!
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    networks:
      - red-bbdd
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-prueba
    environment:
      PGADMIN_DEFAULT_EMAIL: alumno@clase.com
      PGADMIN_DEFAULT_PASSWORD: AdminClase2026!
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - red-bbdd
    restart: unless-stopped

volumes:
  datos_postgres:

networks:
  red-bbdd: